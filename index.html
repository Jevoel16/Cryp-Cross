<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b12" />
    <meta name="color-scheme" content="dark light" />
    <script src="/theme.js"></script>
    <link rel="preload" href="/img/logo-72.webp" as="image" type="image/webp" />
    <title>Cryp-Cross</title>
    <!-- Defaults for the home page; each route updates these at runtime (src/usePageMeta.js). -->
    <meta
      name="description"
      content="Cryp-Cross is a free daily cryptographic crossword: every clue is hidden behind a classical cipher. Decode the clues, fill the grid and climb the leaderboard."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cryp-Cross" />
    <meta property="og:title" content="Cryp-Cross" />
    <meta
      property="og:description"
      content="A free daily crossword with encrypted clues. Crack the cipher, fill the grid, race the leaderboard."
    />
    <meta property="og:image" content="/logo512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Cryp-Cross",
            "description": "A free daily cryptographic crossword whose clues are encrypted with Caesar, Atbash or Vigenere ciphers.",
            "inLanguage": "en",
            "creator": {
              "@type": "Organization",
              "name": "Cryp-Cross Team",
              "sameAs": ["https://github.com/Jevoel16/Cryp-Cross"]
            }
          },
          {
            "@type": "Game",
            "name": "Cryp-Cross daily cipher crossword",
            "description": "A new crossword every day. Every clue is encrypted with a classical cipher; decode the clues, then fill the grid.",
            "genre": ["Crossword", "Puzzle", "Cryptography"],
            "inLanguage": "en",
            "isAccessibleForFree": true,
            "numberOfPlayers": {
              "@type": "QuantitativeValue",
              "minValue": 1
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
